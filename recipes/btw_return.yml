version: 1
policy:
  continue_on_error: false

steps:
  - name: load_source
    fn: tools.data_io.loader.load_source_dataframe
    args:
      path: "${params.input | default('data/demo_transactions.csv')}"

  - name: validate_source
    fn: tools.validation.schema.validate_dataframe
    args:
      df: "${steps.load_source.result}"
      schema_id: kaggle_grocery_v1

  - name: normalize
    fn: tools.data_io.loader.normalize_dataframe
    args:
      df: "${steps.load_source.result}"
      config_path: config.yaml

  - name: filter_period
    fn: tools.analysis.period.filter_period
    args:
      df: "${steps.normalize.result}"
      period: "${params.period}"

  - name: summarize
    fn: tools.analysis.bookkeeping.summarize
    args:
      df: "${steps.filter_period.result}"
      groupby: category

  - name: load_vat_rules
    fn: tools.analysis.tax.load_rules
    args:
      path: rules/nl_vat_2025.yaml

  - name: calculate_vat_demo
    fn: tools.analysis.tax.compute_vat
    args:
      data: "${steps.summarize.result}"
      rules: "${steps.load_vat_rules.result}"
      apply_kor: false

  - name: save_artifacts
    fn: tools.data_io.exporter.save_summary
    args:
      summary: "${steps.calculate_vat_demo.result}"
      period: "${params.period}"
      json_path: "${params.json_path | default('workspace/summary_latest.json')}"
      md_path: "${params.md_path | default('workspace/summary_latest.md')}"
